name: Deploy Graph Visualizer to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      # This permission is required for OpenID Connect (OIDC)
      id-token: write
      contents: read
    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Setup Node.js for backend
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      # Optional: run backend build/test
      - name: Build Backend
        working-directory: backend
        run: |
          npm run build --if-present

      # Login to Azure using the automatically created secrets
      - name: Azure Login
        uses: azure/login@v2
        with:
          # Use the automatically generated secrets from Azure
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CEE693FDF7D24529B20271852905 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CEE693FDF7D24529B20271852905 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CEE693FDF7D24529B20271852905 }}

      # Deploy backend
      - name: Deploy Backend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'graph-backend'
          slot-name: 'Production'
          package: ./backend

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      # This permission is required for OpenID Connect (OIDC)
      id-token: write
      contents: read
    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Setup Node.js for frontend
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      # Build frontend
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # Login to Azure using the automatically created secrets
      - name: Azure Login
        uses: azure/login@v2
        with:
          # Use the automatically generated secrets from Azure
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CEE693FDF7D24529B20271852905 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CEE693FDF7D24529B20271852905 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CEE693FDF7D24529B20271852905 }}

      # Deploy frontend
      - name: Deploy Frontend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'graph-frontend'
          slot-name: 'Production'
          package: ./frontend/dist
